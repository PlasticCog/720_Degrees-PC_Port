# Builds the game and the level editor for Linux and macOS and attaches the zips to the GitHub
# release of the tag.  No ROMs are needed: the game runs only the rewritten programs, and
# D720_ROM_FREE leaves out anything generated from ROMs.  The Windows zip is built with MSYS2
# (tools/package.py) and attached by hand.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the zips to
        required: true

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86-64, os: ubuntu-22.04 }
          - { name: Linux ARM64, os: ubuntu-22.04-arm }
          - { name: macOS Apple Silicon, os: macos-14 }
          - { name: macOS Intel, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-12 libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxtst-dev libxfixes-dev libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # Linux: built on Ubuntu 22.04 (glibc 2.35) with the C++ runtime linked in, so it runs on
      # most current distributions; macOS: for macOS 11 and later
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -S port -B port/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DD720_TRANSLATION=OFF -DD720_ROM_FREE=ON
          -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake -S port -B port/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DD720_TRANSLATION=OFF -DD720_ROM_FREE=ON
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build port/build --parallel --target 720degrees editor720

      - name: Package
        run: python3 tools/package.py --version "${TAG#v}"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.zip --clobber
